name: Deploy sergeysova.com

on:
  push:
    branches: [main]
    paths:
      - 'apps/sergeysova-com/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sergeysova.yml'
  workflow_dispatch:

jobs:
  en:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🐧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔍 Installation
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build — sergeysova.com (EN)
        run: pnpm --filter @sova-web/sergeysova-com build
        env:
          DEVTO_API_KEY: '${{ secrets.DEVTO_API_KEY }}'
          YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'
          EFFECTOR_COMMUNITY_API_KEY: '${{ secrets.EFFECTOR_COMMUNITY_API_KEY }}'
          SIMPLECAST_API_KEY: '${{ secrets.SIMPLECAST_API_KEY }}'
          PUBLIC_SITE: https://sergeysova.com
          PUBLIC_LANGUAGE: en
          PUBLIC_GTAG: G-PHKCHPT847

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          workingDirectory: apps/sergeysova-com
          command: deploy --name=sergeysova-com

  ru:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🐧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔍 Installation
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build — ru.sergeysova.com (RU)
        run: pnpm --filter @sova-web/sergeysova-com build
        env:
          DEVTO_API_KEY: '${{ secrets.DEVTO_API_KEY }}'
          YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'
          EFFECTOR_COMMUNITY_API_KEY: '${{ secrets.EFFECTOR_COMMUNITY_API_KEY }}'
          SIMPLECAST_API_KEY: '${{ secrets.SIMPLECAST_API_KEY }}'
          PUBLIC_SITE: https://ru.sergeysova.com
          PUBLIC_LANGUAGE: ru
          PUBLIC_GTAG: G-PHKCHPT847

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          workingDirectory: apps/sergeysova-com
          command: deploy --name=ru-sergeysova-com
