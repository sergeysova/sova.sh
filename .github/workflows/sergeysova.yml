name: Deploy sergeysova.com

# ru.sergeysova.com пока не существует (нет apps/sergeysova-brand и самого
# домена) — job появится здесь же, когда дойдём до Phase 2 из
# docs/sova-web-monorepo-plan.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/sova-sh/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sergeysova.yml'
  workflow_dispatch:

jobs:
  en:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🐧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔍 Installation
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build — sergeysova.com (EN, временно из apps/sova-sh)
        run: pnpm --filter @sova-web/sova-sh build
        env:
          DEVTO_API_KEY: '${{ secrets.DEVTO_API_KEY }}'
          YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'
          EFFECTOR_COMMUNITY_API_KEY: '${{ secrets.EFFECTOR_COMMUNITY_API_KEY }}'
          SIMPLECAST_API_KEY: '${{ secrets.SIMPLECAST_API_KEY }}'
          PUBLIC_SITE: https://sergeysova.com
          PUBLIC_LANGUAGE: en
          PUBLIC_GTAG: G-PHKCHPT847

      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: gh-pages
          folder: apps/sova-sh/dist
          repository-name: sergeysova/sergeysova.com
          token: '${{ secrets.ACCESS_TOKEN }}'
