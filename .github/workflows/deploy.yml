name: Deploy sova.sh + sergeysova.com

on:
  push:
    branches: [main]
    paths:
      - 'apps/sova-sh/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  sova-sh:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🐧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔍 Installation
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build — sova.sh
        run: pnpm --filter @sova-web/sova-sh build
        env:
          DEVTO_API_KEY: '${{ secrets.DEVTO_API_KEY }}'
          YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'
          EFFECTOR_COMMUNITY_API_KEY: '${{ secrets.EFFECTOR_COMMUNITY_API_KEY }}'
          SIMPLECAST_API_KEY: '${{ secrets.SIMPLECAST_API_KEY }}'
          PUBLIC_SITE: https://sova.sh
          PUBLIC_LANGUAGE: ru
          PUBLIC_GTAG: UA-67236238-5

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          command: pages deploy apps/sova-sh/dist --project-name=sova-sh --branch=main

  # sergeysova.com всё ещё собирается из apps/sova-sh, см. docs/sova-web-monorepo-plan.md
  sergeysova-com:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🐧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔍 Installation
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build — sergeysova.com (EN, временно из apps/sova-sh)
        run: pnpm --filter @sova-web/sova-sh build
        env:
          DEVTO_API_KEY: '${{ secrets.DEVTO_API_KEY }}'
          YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'
          EFFECTOR_COMMUNITY_API_KEY: '${{ secrets.EFFECTOR_COMMUNITY_API_KEY }}'
          SIMPLECAST_API_KEY: '${{ secrets.SIMPLECAST_API_KEY }}'
          PUBLIC_SITE: https://sergeysova.com
          PUBLIC_LANGUAGE: en
          PUBLIC_GTAG: G-PHKCHPT847

      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: gh-pages
          folder: apps/sova-sh/dist
          repository-name: sergeysova/sergeysova.com
          token: '${{ secrets.ACCESS_TOKEN }}'
